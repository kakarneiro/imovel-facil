spring:
  application:
    name: imovel-facil

  datasource:
    url: jdbc:h2:mem:imoveis

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false


  cache:
    cache-names: properties

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:

        include: health,info,caches

      cors:
        allowed-origins: "*"
        allowed-methods: "*"
  info:
    env:
      enabled: true # necessário para o bloco "info" abaixo aparecer em /actuator/info


info:
  app:
    name: Imóvel Fácil API
    version: 1.0.0